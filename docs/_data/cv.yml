projects:
- slug: animated-portfolio
  name: Animated Portfolio
  stack: Streamlit / HTML / CSS
  port: streamlit run streamlit_app.py
  intro: A Streamlit Cloud adaptation of the fictional Northstar studio site. Sidebar navigation switches
    sections; CSS creates animated hero artwork and responsive case-study cards. The original static HTML/CSS/JS
    site remains in the folder for comparison.
  files:
  - path: streamlit_app.py
    purpose: Streamlit navigation, sections and CSS artwork
  - path: index.html + styles.css
    purpose: Original standalone site
  - path: script.js
    purpose: Original mobile navigation and scroll reveals
  structure:
  - Browser session
  - Streamlit widgets
  - HTML + CSS styling
  - Visible section
  flow:
  - Open the Streamlit app
  - Select a sidebar section
  - Streamlit reruns the script
  - CSS renders motion and cards
  - Selected content appears
  features: Animated hero, responsive navigation, case-study cards and reduced-motion support.
  detail: Streamlit maintains the selected navigation option as widget state. Python decides which section
    to render, and a scoped CSS stylesheet handles the hero, artwork and card motion. The HTML/CSS/JavaScript
    original is retained as a separate exercise to compare browser-native and Streamlit approaches.
  scenario: Select Work in the sidebar to reveal three fictional portfolio cards.
  limits: Fictional content. This Streamlit edition is an adaptation; original static site interactions differ.
  number: '01'
  icon: ✦
  category: Frontend / Motion
  summary: An animated Streamlit studio portfolio with navigation, responsive cards and reduced-motion styling.
  runtime: Streamlit Community Cloud or local Streamlit
  streamlit_entrypoint: projects/animated-portfolio/streamlit_app.py
  demo_url: ''
- slug: django-htmx-taskboard
  name: Django Task Board
  stack: Streamlit / session state (Django / HTMX original)
  port: streamlit run streamlit_app.py
  intro: A deployable Streamlit task board that creates, filters, completes and deletes tasks in isolated
    session state. The original Django/HTMX implementation remains available for local backend study.
  files:
  - path: streamlit_app.py
    purpose: Streamlit task interface and session state
  - path: board/models.py + forms.py
    purpose: Original Django data model and validation
  - path: board/views.py
    purpose: Original HTMX request and fragment handling
  structure:
  - Browser session
  - Streamlit controls
  - Session task list
  - Filtered board
  flow:
  - Enter and validate a task
  - Append to session task list
  - Filter or change task state
  - Streamlit reruns the page
  - Updated board appears
  features: Create, filter, complete, reopen and delete tasks; isolated browser-session data.
  detail: The Cloud app validates task input and stores each task in Streamlit session state, so users do
    not see one another’s entries. Actions mutate the current session and rerun the page. The Django/HTMX
    project still demonstrates server-rendered partial updates, models and CSRF separately when run locally.
  scenario: Add a task, mark it done and use the Done filter to inspect it.
  limits: Cloud tasks disappear when the session or app restarts. The Streamlit edition does not expose Django
    or HTMX at runtime.
  number: '02'
  icon: ▦
  category: Django / HTMX
  summary: A session-scoped Streamlit task board with creation, filtering and progress actions.
  runtime: Streamlit Community Cloud or local Streamlit
  streamlit_entrypoint: projects/django-htmx-taskboard/streamlit_app.py
  demo_url: ''
- slug: fastapi-rag-chat
  name: Notebook Chat
  stack: Streamlit / lexical RAG (FastAPI original)
  port: streamlit run streamlit_app.py
  intro: A Streamlit chat demo that splits notes into passages, ranks them with lexical retrieval and displays
    matching excerpts with source citations. The original FastAPI/SQLite/Ollama app remains for local study.
  files:
  - path: streamlit_app.py
    purpose: Chat, knowledge library and session state
  - path: retrieval.py
    purpose: Chunking and lexical TF-IDF ranking
  - path: knowledge/
    purpose: Bundled demonstration notes
  - path: app.py
    purpose: Original local FastAPI and SQLite implementation
  structure:
  - Browser session
  - Streamlit chat
  - TF-IDF retriever
  - Cited passages
  flow:
  - Add or load example notes
  - Split notes into passages
  - Ask question; rank passages
  - Display cited excerpts
  - Save chat in session
  features: Upload or paste text notes, delete documents, ask questions, inspect ranked citations and clear
    chat.
  detail: The Streamlit app seeds example Markdown notes, stores additions per browser session and chunks
    them using the shared retrieval module. A question ranks passages by lexical TF-IDF and presents matching
    excerpts with citations; it clearly labels them as retrieved text, not generated answers. The separate
    local FastAPI app supports optional Ollama.
  scenario: Ask about a bundled note and expand Retrieved sources to inspect the passages.
  limits: No language-model generation in the Cloud edition. Lexical matching can miss synonyms; session notes
    and chat disappear on restart. Avoid sensitive uploads.
  number: '03'
  icon: ◈
  category: FastAPI / RAG
  summary: A Streamlit knowledge chat with session-scoped notes and cited lexical retrieval.
  runtime: Streamlit Community Cloud or local Streamlit
  streamlit_entrypoint: projects/fastapi-rag-chat/streamlit_app.py
  demo_url: ''
- slug: job-application-tracker
  name: Job Application Tracker
  stack: Streamlit / SQLite
  port: streamlit run app.py --server.port 8501
  intro: A Streamlit dashboard for fictional job applications. It uses a separate temporary SQLite database
    for each browser session on the shared Cloud instance.
  files:
  - path: app.py
    purpose: Forms, filters, tabs and metrics
  - path: application_store.py
    purpose: Validation and SQLite queries
  - path: tests/test_storage.py
    purpose: Temporary-database lifecycle check
  structure:
  - Browser session
  - Streamlit app
  - Storage module
  - Session SQLite
  flow:
  - Enter company, role and status
  - Validate required fields
  - Write to session SQLite file
  - Re-read application list
  - Filter, edit or delete in UI
  features: Add, update, delete, search and status-filter records; metrics for interviews and offers.
  detail: Streamlit forms gather company, role, status and notes. The storage module validates input and uses
    parameterized SQL to update a per-session temporary SQLite file. After each action, the app reruns, reads
    the current session’s data and recalculates metrics. Other visitors use separate database paths.
  scenario: After an interview, change an application status to Interview and see the dashboard count update.
  limits: Session data are temporary and may disappear when the server restarts. Use fictional entries; this
    is not a durable job-search database.
  number: '04'
  icon: ↗
  category: Streamlit / SQLite
  summary: A Streamlit dashboard to record, search, filter and update job applications.
  runtime: Streamlit Community Cloud or local Streamlit
  streamlit_entrypoint: projects/job-application-tracker/app.py
  demo_url: ''
- slug: study-planner
  name: Study Planner
  stack: Streamlit / SQLite
  port: streamlit run app.py --server.port 8502
  intro: A Streamlit coursework planner. A session-specific temporary SQLite file retains tasks during a browser
    session without exposing them to other visitors.
  files:
  - path: app.py
    purpose: Task forms, filters and metrics
  - path: planner_store.py
    purpose: Task validation and SQLite
  - path: tests/test_storage.py
    purpose: Create, edit and delete checks
  structure:
  - Browser session
  - Streamlit app
  - Storage module
  - Session SQLite
  flow:
  - Enter title, course and status
  - Validate required fields
  - Save in session SQLite file
  - Re-read task list
  - Search, edit or complete task
  features: Create and edit coursework, track progress, search notes and filter by task status.
  detail: The UI separates review, creation and editing into tabs. The storage module validates fields and
    uses parameterized SQL. Every session receives a distinct temporary SQLite path, and metrics are recalculated
    after each interaction.
  scenario: Add a coursework task, then change it from To do to Done and verify the progress count.
  limits: Session data are temporary and may disappear on restart; use fictional coursework tasks.
  number: '05'
  icon: ◎
  category: Streamlit / SQLite
  summary: A Streamlit coursework planner with task editing, status filters and persistent storage.
  runtime: Streamlit Community Cloud or local Streamlit
  streamlit_entrypoint: projects/study-planner/app.py
  demo_url: ''
- slug: data-cleaning-studio
  name: Data Cleaning Studio
  stack: Streamlit / Pandas / public APIs
  port: streamlit run app.py --server.port 8503
  intro: An interactive data workflow with a fictional offline sample, CSV upload and fixed public sources
    for weather, currency rates and economic indicators.
  files:
  - path: app.py
    purpose: Source selection and cleaning controls
  - path: sources.py
    purpose: Open-Meteo, ECB, World Bank clients
  - path: cleaning.py
    purpose: Pure Pandas transformations
  - path: samples/
    purpose: Offline demonstration dataset
  structure:
  - CSV or fixed API
  - Streamlit app
  - Pandas cleaning
  - CSV export
  flow:
  - Load sample, upload or fetch
  - Preview original table
  - Select cleaning options
  - Profile and chart transformed copy
  - Download full cleaned CSV
  features: Trim text, deduplicate, parse dates and numbers, handle missing values and inspect before/after
    metrics.
  detail: A source adapter turns each supported API response or CSV input into a Pandas table. A pure cleaning
    function copies the original table before applying selected transformations, so previewing alternatives
    does not alter the source. Column profiles expose types, missing values and unique counts; the final table
    is serialized to CSV for download.
  scenario: Load the fictional sales sample, convert revenue to numbers, fill numeric medians and compare
    missing-cell counts before exporting.
  limits: Public APIs need network access and may rate limit. Uploaded data remains in the session; previews
    show 500 rows while downloads retain all rows. Avoid sensitive uploads.
  number: '06'
  icon: ◫
  category: Streamlit / Data
  summary: Clean CSVs, explore public weather, financial and economic data, and export results.
  runtime: Streamlit Community Cloud or local Streamlit
  streamlit_entrypoint: projects/data-cleaning-studio/app.py
  demo_url: ''
