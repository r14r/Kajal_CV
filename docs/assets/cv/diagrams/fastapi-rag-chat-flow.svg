<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" role="img" aria-label="Data flow of Notebook Chat"><rect x="46" y="18" width="808" height="44" rx="11" fill="#eaf5f6" stroke="#b5d8df"/><circle cx="72" cy="40" r="15" fill="#0d7896"/><text x="72" y="45" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">1</text><text x="100" y="46" fill="#142d3d" font-family="Arial,sans-serif" font-size="16">Add or load example notes</text><path d="M450,62 V80 M444,74 L450,80 L456,74" fill="none" stroke="#0d7896" stroke-width="2"/><rect x="46" y="80" width="808" height="44" rx="11" fill="#f3f7f9" stroke="#b5d8df"/><circle cx="72" cy="102" r="15" fill="#0d7896"/><text x="72" y="107" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">2</text><text x="100" y="108" fill="#142d3d" font-family="Arial,sans-serif" font-size="16">Split notes into passages</text><path d="M450,124 V142 M444,136 L450,142 L456,136" fill="none" stroke="#0d7896" stroke-width="2"/><rect x="46" y="142" width="808" height="44" rx="11" fill="#eaf5f6" stroke="#b5d8df"/><circle cx="72" cy="164" r="15" fill="#0d7896"/><text x="72" y="169" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">3</text><text x="100" y="170" fill="#142d3d" font-family="Arial,sans-serif" font-size="16">Ask question; rank passages</text><path d="M450,186 V204 M444,198 L450,204 L456,198" fill="none" stroke="#0d7896" stroke-width="2"/><rect x="46" y="204" width="808" height="44" rx="11" fill="#f3f7f9" stroke="#b5d8df"/><circle cx="72" cy="226" r="15" fill="#0d7896"/><text x="72" y="231" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">4</text><text x="100" y="232" fill="#142d3d" font-family="Arial,sans-serif" font-size="16">Display cited excerpts</text><path d="M450,248 V266 M444,260 L450,266 L456,260" fill="none" stroke="#0d7896" stroke-width="2"/><rect x="46" y="266" width="808" height="44" rx="11" fill="#eaf5f6" stroke="#b5d8df"/><circle cx="72" cy="288" r="15" fill="#0d7896"/><text x="72" y="293" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="15">5</text><text x="100" y="294" fill="#142d3d" font-family="Arial,sans-serif" font-size="16">Save chat in session</text></svg>